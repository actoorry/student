# suxin 前端 Nginx 站点配置
# 反代 /admin-api 到后端 backend:1930，并提供 history 路由回退与 WebSocket 升级支持

server {
    listen       80;
    server_name  _;

    # 上传大小限制（后端 multipart 最大 32MB）
    client_max_body_size 32m;

    # 开启 gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 前端静态资源（history 路由模式必须 try_files 回退到 index.html）
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    # 注意：proxy_pass 末尾不带斜杠，保留完整 /admin-api 前缀路径
    location /admin-api/ {
        proxy_pass http://backend:1930;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 反向代理（/infra/ws）
    location /infra/ws {
        proxy_pass http://backend:1930;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
